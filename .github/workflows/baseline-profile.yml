name: Baseline Profile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'baselineprofile/**'
      - '.github/workflows/baseline-profile.yml'
concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true
env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
jobs:
  generate:
    name: Generate profiles and benchmark startup (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "TOGETHER_BEARER_TOKEN=${{ secrets.TOGETHER_BEARER_TOKEN }}" >> local.properties
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate the Baseline and Startup Profiles, then benchmark them
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ./gradlew :app:generateProdReleaseBaselineProfile -Pbitchord.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
            ./gradlew :baselineprofile:connectedProdBenchmarkReleaseAndroidTest -Pbitchord.abis=x86_64 -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR || true
      - name: Print the benchmark summary
        if: always()
        run: |
          find baselineprofile/build -name '*benchmarkData.json' -print -exec cat {} \; 2>/dev/null | head -c 20000 || true
          for f in $(find app/src -path '*generated/baselineProfiles*' -name '*.txt'); do echo "$f: $(wc -l < "$f") rules"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-profiles
          path: |
            app/src/**/generated/baselineProfiles/
            baselineprofile/build/outputs/connected_android_test_additional_output/
