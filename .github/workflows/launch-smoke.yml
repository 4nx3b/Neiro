name: Launch Smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: launch-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

jobs:
  build:
    name: Build x86_64 APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties and the release keystore
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "TOGETHER_BEARER_TOKEN=${{ secrets.TOGETHER_BEARER_TOKEN }}" >> local.properties
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          fi

      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Pre-seed the Gradle distribution
        run: |
          DIST="$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin/4mmrk48ojqgqwhmlxtzuti6qa"
          mkdir -p "$DIST"
          if [ ! -f "$DIST/gradle-9.3.1-bin.zip" ]; then
            for attempt in 1 2 3 4 5; do
              curl -L --retry 5 --retry-delay 10 --retry-all-errors \
                --connect-timeout 60 --max-time 900 --fail \
                -o "$DIST/gradle-9.3.1-bin.zip.part" \
                https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip && break
              echo "download attempt $attempt failed; retrying" >&2
              sleep 15
            done
            mv "$DIST/gradle-9.3.1-bin.zip.part" "$DIST/gradle-9.3.1-bin.zip"
          fi

      - name: Build devDebug and prodRelease (x86_64)
        run: ./gradlew :app:assembleDevDebug :app:assembleProdRelease -Pbitchord.abis=x86_64

      - name: Print the resolved Compose line
        continue-on-error: true
        run: |
          echo "== app prodReleaseRuntimeClasspath (what the phone runs)"
          ./gradlew -q :app:dependencies --configuration prodReleaseRuntimeClasspath \
            | grep -E 'androidx.compose|org.jetbrains.compose|haze|richtext|lottie-compose|reorderable|shimmer|coil-compose|kyant' \
            | sed 's/^[ |\\+-]*//' | sort -u
          echo "== sharedUi releaseCompileClasspath, material3 (what sharedUi was compiled against)"
          ./gradlew -q :sharedUi:dependencies --configuration releaseCompileClasspath \
            | grep -E 'material3|material-icons' | sed 's/^[ |\\+-]*//' | sort -u

      - name: Collect and sign the APKs
        run: |
          mkdir -p apks
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} apks/ \;
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -validity 10000
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in apks/*-unsigned.apk; do
            [ -e "$apk" ] || continue
            signed="${apk%-unsigned.apk}.apk"
            "$signer" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
              --ks-key-alias androiddebugkey --out "$signed" "$apk"
            rm "$apk"
          done
          ls -l apks

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-apks
          path: apks/*.apk

  launch:
    name: Launch on API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smoke-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch each APK and read logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash .github/scripts/launch-smoke.sh ${{ matrix.api-level }} apks

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-smoke-api${{ matrix.api-level }}
          path: smoke-out/
