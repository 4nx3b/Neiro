name: Diag Build

on:
  push:
    branches: [arena/d984ef3d-neiro]

concurrency:
  group: diag-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

jobs:
  build:
    name: Diag build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "TOGETHER_BEARER_TOKEN=${{ secrets.TOGETHER_BEARER_TOKEN }}" >> local.properties
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
            {
              echo "storeFile=bitchord-release.jks"
              echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > keystore.properties
          fi

      - run: chmod +x gradlew

      - name: Pre-seed the Gradle distribution
        run: |
          DIST="$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin/4mmrk48ojqgqwhmlxtzuti6qa"
          mkdir -p "$DIST"
          if [ ! -f "$DIST/gradle-9.3.1-bin.zip" ]; then
            for attempt in 1 2 3 4 5; do
              curl -L --retry 5 --retry-delay 10 --retry-all-errors \
                --connect-timeout 60 --max-time 900 --fail \
                -o "$DIST/gradle-9.3.1-bin.zip.part" \
                https://github.com/gradle/gradle-distributions/releases/download/v9.3.1/gradle-9.3.1-bin.zip && break
              sleep 15
            done
            mv "$DIST/gradle-9.3.1-bin.zip.part" "$DIST/gradle-9.3.1-bin.zip"
          fi

      - name: Build dev, test, TV, release
        run: |
          ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest \
            :tv:assembleDevDebug \
            :app:assembleProdRelease -Pbitchord.abis=arm64-v8a --continue > build.log 2>&1 || echo "gradle failed"

      - name: Publish the errors
        if: always()
        shell: python3 {0}
        run: |
          import re
          log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          start = re.compile(r"^e: ")
          heads = re.compile(r"^(FAILURE|BUILD FAILED|\s*\* What went wrong|Execution failed for task|Caused by|> Task .*FAILED)")
          hits, i = [], 0
          while i < len(log):
              line = log[i]
              if start.match(line):
                  block = [line.strip()]
                  j = i + 1
                  while j < len(log) and j <= i + 8:
                      nxt = log[j]
                      if start.match(nxt) or heads.match(nxt) or nxt.strip() == "":
                          break
                      block.append(nxt.strip())
                      j += 1
                  hits.append("<NL>".join(block))
                  i = j
                  continue
              if heads.match(line):
                  hits.append(line.strip())
              i += 1
          hits = [h for h in hits if "deprecated" not in h][-24:]
          print("\n\n".join(hits) if hits else "no error lines matched")
          chunks, cur = [], ""
          for h in hits:
              if len(cur) + len(h) + 2 > 2400:
                  chunks.append(cur); cur = h
              else:
                  cur = (cur + "<NL><NL>" + h) if cur else h
          if cur:
              chunks.append(cur)
          for i, c in enumerate(chunks[:8]):
              print(f"::error title=log{i}::{c}")
          if "BUILD SUCCESSFUL" not in "\n".join(log):
              open("failed.flag", "w").write("1")

      - name: Fail if the build failed
        run: |
          [ -f failed.flag ] && exit 1 || exit 0
