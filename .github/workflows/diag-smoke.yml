name: Diag Smoke

on:
  push:
    branches: [arena/d984ef3d-neiro]

permissions:
  contents: read
  actions: read

jobs:
  api34:
    name: Diag smoke API 34
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smoke-apks
          path: apks
          run-id: 44509682936
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch each APK and read logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: |
            timeout -k 30 420 bash .github/scripts/launch-smoke.sh 34 apks > smoke.log 2>&1
            echo "EXITCODE=$?" >> smoke.log

      - name: Publish what the smoke saw
        if: always()
        shell: python3 {0}
        run: |
          lines = open("smoke.log", encoding="utf-8", errors="replace").read().splitlines()
          code = next((l for l in lines if l.startswith("EXITCODE=")), "EXITCODE=missing")
          summary = [l for l in lines if l.startswith(("launch ", "ALIVE:", "DEAD:", "APKs to launch", "MISSING", "INSTALL FAILED", "PACKAGE MISMATCH"))]
          print("\n".join(lines))
          chunks, cur = [], ""
          for h in [code] + summary:
              if len(cur) + len(h) + 1 > 2300:
                  chunks.append(cur); cur = h
              else:
                  cur = (cur + "<NL>" + h) if cur else h
          if cur:
              chunks.append(cur)
          fatal = []
          for i, l in enumerate(lines):
              if "FATAL EXCEPTION" in l:
                  fatal.extend(lines[i:i+40])
                  break
          tail = []
          for i, l in enumerate(lines):
              if l.startswith("EXITCODE=") and not l.endswith("=0"):
                  tail = lines[max(0, i-40):i]
          for n, c in enumerate(chunks[:6]):
              print(f"::error title=smoke-summary{n}::{c}")
          if fatal:
              print("::error title=fatal::" + "<NL>".join(fatal))
          if tail:
              print("::error title=logtail::" + "<NL>".join(tail))
