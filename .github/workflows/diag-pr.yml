name: Diag PR

on:
  push:
    branches: [arena/2d5704be-neiro]
  pull_request:

concurrency:
  group: diag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Diag App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Build dev, test, build release
        run: |
          ./gradlew :app:assembleDevDebug :app:testDevDebugUnitTest :app:assembleProdRelease --continue > build.log 2>&1 || echo "gradle failed"

      - name: Publish the errors
        if: always()
        shell: python3 {0}
        run: |
          import json, os, re, subprocess
          log = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          pat = re.compile(r"^(e: |FAILURE|BUILD FAILED|\s*\* What went wrong|Execution failed for task|Caused by|> Task .*FAILED)|requires libraries and applications|compile against version|minCompileSdk|Dependency '")
          hits = [l.strip() for l in log if pat.search(l)]
          hits = [h for h in hits if "deprecated" not in h][-40:]
          if not hits:
              print("no error lines matched")
          else:
              print("\n".join(hits))
          chunks, cur = [], ""
          for h in hits:
              if len(cur) + len(h) + 1 > 2500:
                  chunks.append(cur); cur = h
              else:
                  cur = (cur + "<NL>" + h) if cur else h
          if cur:
              chunks.append(cur)
          for i, c in enumerate(chunks[:8]):
              print(f"::error title=log{i}::{c}")
          failed = "BUILD SUCCESSFUL" not in "\n".join(log)
          print(f"::error title=result::build_successful={not failed}")
          if failed:
              open("failed.flag", "w").write("1")

      - name: Fail if the build failed
        run: |
          [ -f failed.flag ] && exit 1 || exit 0

  tv:
    name: Diag TV
    runs-on: ubuntu-latest
    steps:
