name: Check

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Gradle wrapper JVM does not read gradle.properties, and its own
# connect timeout is a hardcoded 10s. Runners whose IPv6 route to the
# distribution CDN is blackholed die inside it; forcing IPv4 for every
# JVM the workflow starts (wrapper included) keeps the download on the
# route that answers.
env:
  JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew
      # The wrapper JVM's own download dies inside its hardcoded 10s connect
      # timeout whenever the route to the distribution CDN degrades - which is
      # exactly what an incident window looks like from a runner. Seeding the
      # zip with a patient curl sidesteps it: the wrapper skips a download
      # whose zip already sits in its expected slot (Installer: "if
      # (!localZipFile.exists())"), so gradlew proceeds straight to unzip.
      # The hash directory is Gradle's own PathAssembler scheme - base36 of the
      # MD5 of the distributionUrl - and is stable for this URL.
      - name: Pre-seed the Gradle distribution
        run: |
          DIST="$HOME/.gradle/wrapper/dists/gradle-8.11.1-bin/ch07yfcfywmhguk3iz62k0jum"
          mkdir -p "$DIST"
          if [ ! -f "$DIST/gradle-8.11.1-bin.zip" ]; then
            for attempt in 1 2 3 4 5; do
              curl -L --retry 5 --retry-delay 10 --retry-all-errors \
                --connect-timeout 60 --max-time 900 --fail \
                -o "$DIST/gradle-8.11.1-bin.zip.part" \
                https://github.com/gradle/gradle-distributions/releases/download/v8.11.1/gradle-8.11.1-bin.zip && break
              echo "download attempt $attempt failed; retrying" >&2
              sleep 15
            done
            mv "$DIST/gradle-8.11.1-bin.zip.part" "$DIST/gradle-8.11.1-bin.zip"
          fi

      - name: Tests
        run: ./gradlew testDevDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
